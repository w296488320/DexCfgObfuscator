name: Build release bundle

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Optional version that must match build.gradle
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Verify and build Maven repository bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: project-version
        shell: bash
        run: |
          version="$(sed -n \
            "/^def pomVersion = /,/^def publicPluginId = /s/.*\\.getOrElse('\([^']*\)').*/\1/p" \
            build.gradle | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build verified release bundle
        env:
          DEXCFG_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: ./build-release.sh

      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: dex-cfg-obfuscator-${{ steps.project-version.outputs.value }}-maven-repo
          path: |
            release/dex-cfg-obfuscator-${{ steps.project-version.outputs.value }}-maven-repo.zip
            release/dex-cfg-obfuscator-${{ steps.project-version.outputs.value }}-maven-repo.zip.sha256
          if-no-files-found: error
          retention-days: 14
