name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release script syntax
        run: >-
          bash -n
          build-release.sh
          build-central-bundle.sh
          scripts/merge-pages-maven-repository.sh
          scripts/publish-github-release-assets.sh

      - name: Run plugin tests and validation
        run: ./gradlew test validatePlugins --no-daemon --no-configuration-cache --no-parallel

      - name: Validate Plugin Portal publication task graph
        run: >-
          ./gradlew publishPlugins --validate-only --dry-run
          --no-daemon
          --no-configuration-cache
          --no-parallel

      - name: Check whitespace errors
        run: git diff --check

  android-consumer:
    name: Android sample (${{ matrix.protection }}, minify=${{ matrix.minify }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # This is the regression that proves string encryption does not accidentally enable CFG.
          - protection: string
            minify: false
          # Exercise CFG line-number preservation without R8 so regressions are attributable to CFG.
          - protection: cfg
            minify: false
          # This covers mapping-aware verification when both protections run after R8.
          - protection: both
            minify: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Build Android consumer sample
        run: >-
          ./gradlew -p samples/android-consumer
          :app:assembleRelease
          -PsampleProtection=${{ matrix.protection }}
          -PsampleMinify=${{ matrix.minify }}
          --no-daemon
          --no-configuration-cache
          --no-parallel

      - name: Smoke-test CFG stack-trace retracing
        if: matrix.protection != 'string'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(
              'samples/android-consumer/app/build/reports/dex-cfg-obfuscator/release.json'
          ).read_text())
          probes = [method for method in report['methods']
                    if method['descriptor'] == '(I)I']
          assert len(probes) == 1, probes
          assert probes[0]['mode'] == 'flattened', probes[0]
          assert probes[0]['reason'] == 'flatten_safe', probes[0]
          PY
          apkanalyzer_path="$(command -v apkanalyzer)"
          probe_args=(
            --apkanalyzer "${apkanalyzer_path}"
            --apk samples/android-consumer/app/build/outputs/apk/release/app-release-unsigned.apk
          )
          if [[ '${{ matrix.minify }}' == 'true' ]]; then
            probe_args+=(
              --mapping samples/android-consumer/app/build/outputs/mapping/release/mapping.txt
            )
          fi
          python3 samples/android-consumer/verify_retrace_probe.py "${probe_args[@]}"
          retraced_file="${RUNNER_TEMP}/release-${{ matrix.protection }}-minify-${{ matrix.minify }}.retraced.txt"
          trace_file="${GITHUB_WORKSPACE}/samples/android-consumer/fixtures/retrace-release.txt"
          if [[ '${{ matrix.minify }}' == 'true' ]]; then
            trace_file="${GITHUB_WORKSPACE}/samples/android-consumer/fixtures/retrace-minified-release.txt"
          fi
          ./gradlew -p samples/android-consumer \
            :app:retraceReleaseDexCfgStackTrace \
            -PsampleProtection=${{ matrix.protection }} \
            -PsampleMinify=${{ matrix.minify }} \
            --trace-file="${trace_file}" \
            --output-file="${retraced_file}" \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel
          test -s "${retraced_file}"
          if [[ '${{ matrix.minify }}' == 'false' ]]; then
            cmp samples/android-consumer/fixtures/retrace-release.txt "${retraced_file}"
          else
            grep -Fq 'com.example.dexcfgsample.ReleaseCrashProbe.divideForRetrace(ReleaseCrashProbe.java:18)' \
              "${retraced_file}"
          fi

      - name: Upload protection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-sample-report-${{ matrix.protection }}-minify-${{ matrix.minify }}
          path: samples/android-consumer/app/build/reports/dex-cfg-obfuscator/
          if-no-files-found: warn
          retention-days: 7
