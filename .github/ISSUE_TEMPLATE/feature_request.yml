name: Feature request
description: Suggest a compatible protection, DSL, or tooling improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete build or protection problem, not only a proposed API.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include DSL or task examples when useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note affected AGP/Gradle versions, application/library modules, R8, incremental builds, or public DSL.
